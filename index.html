<!doctype html>
<html>
    <head>
        <title>Java Programming MOOC Solutions</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <h2>Java Programming MOOC Solutions</h2>
        <select id="select"></select>
        <p>
            Showing solution for:
            <span class="output"></span>
        </p>

        <button onclick="getOption()">Show</button>
        <pre><code id="code-block" class="language-java">Select exercise from dropdown above.</code></pre>
        <script>
            let path = [];
            fetch(
                "https://raw.githubusercontent.com/Akash8130/mooc-java-programming-i/refs/heads/main/path.txt",
            )
                .then((response) => response.text())
                .then((data) => {
                    path = data.split(/\r?\n/);
                    path = path.filter((line) => line.trim() !== "");
                    dropdownList();
                });

            function dropdownList() {
                const select = document.getElementById("select");
                for (let i = 0; i < path.length; i++) {
                    select.add(new Option(path[i]));
                }
            }
            function getOption() {
                selectElement = document.querySelector("#select");
                output = selectElement.value;
                longName = output;
                shortName = output.split(".")[1];
                document.querySelector(".output").textContent = shortName;
                fetch(
                    `https://raw.githubusercontent.com/Akash8130/mooc-java-programming-i/refs/heads/main/mooc-java-programming-i/${longName}/src/main/java/${shortName}.java`,
                )
                    .then((response) => response.text())
                    .then((data) => {
                        const codeElement =
                            document.getElementById("code-block");
                        codeElement.textContent = data;

                        hljs.highlightElement(codeElement);
                    });
            }
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/languages/go.min.js"></script>
    </body>
</html>
